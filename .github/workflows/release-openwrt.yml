name: Release OpenWrt packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        type: string
      prerelease:
        description: Mark as prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: openwrt-${{ github.workflow }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  openwrt-packages:
    name: OpenWrt ${{ matrix.sdk }} (${{ matrix.format }}, all architectures)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: '24.10.5'
            format: ipk
          - sdk: '25.12.5'
            format: apk

    steps:
      - name: Validate release tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          git check-ref-format "refs/tags/${TAG}"

      - name: Checkout repository
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: '1000'
          GIT_HTTP_LOW_SPEED_TIME: '30'
        uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate frontend, DNS resolver and release packaging
        run: |
          sh tests/test-resolve.sh
          python3 tests/test-monitor.py
          node --check luci-app-udp2raw-ultra/htdocs/luci-static/resources/view/udp2raw-ultra/udp2raw.js
          python3 tests/test-release.py

      - name: Prepare SDK feed and runtime dependency
        timeout-minutes: 5
        run: |
          set -euo pipefail
          mkdir -p .ci-feed/udp2raw
          cp -a luci-app-udp2raw-ultra .ci-feed/
          # The official SDK feeds do not define udp2raw. Use the same
          # dependency recipe as PonWrt, pinned to an ImmortalWrt commit.
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 \
            https://raw.githubusercontent.com/immortalwrt/packages/7f3930b97fe90537efdac757fd7f2f4d74517032/net/udp2raw/Makefile \
            --output .ci-feed/udp2raw/Makefile
          echo '919d244000a2be6cff487d63a0b3411845b282860adcbb6b331ce0f760705fe6  .ci-feed/udp2raw/Makefile' | sha256sum -c -

      - name: Build OpenWrt packages
        uses: openwrt/gh-action-sdk@v11
        timeout-minutes: 75
        env:
          # JS, Shell and translations are architecture independent.
          ARCH: x86_64-${{ matrix.sdk }}
          FEED_DIR: ${{ github.workspace }}/.ci-feed
          NO_SHFMT_CHECK: true
          # LuCI builds the language package as a subpackage of this target.
          PACKAGES: luci-app-udp2raw-ultra
          V: sc

      - name: Collect frontend and Chinese translation
        env:
          SDK: ${{ matrix.sdk }}
          FORMAT: ${{ matrix.format }}
        run: |
          bash scripts/collect-packages.sh

      - name: Upload OpenWrt packages
        uses: actions/upload-artifact@v4
        with:
          name: udp2raw-openwrt-${{ matrix.sdk }}-${{ matrix.format }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: udp2raw-build-logs-${{ matrix.sdk }}-${{ matrix.format }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish OpenWrt packages
    needs: openwrt-packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Download OpenWrt packages
        uses: actions/download-artifact@v4
        timeout-minutes: 5
        with:
          pattern: udp2raw-openwrt-*
          path: release
          merge-multiple: true

      - name: Create release and upload packages
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          TARGET: ${{ github.sha }}
          GH_PROMPT_DISABLED: '1'
        run: |
          set -euo pipefail
          retry() {
            local attempt
            for attempt in 1 2 3; do
              if timeout --kill-after=5s 90s "$@"; then
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 5))
              fi
            done
            return 1
          }
          # A failed lookup can also mean a network error. Check again on
          # retries so a completed-but-timed-out creation remains idempotent.
          ensure_release() {
            if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
              return 0
            fi
            local args=(
              "$TAG"
              --repo "$REPOSITORY"
              --target "$TARGET"
              --title "$TAG"
              --generate-notes
            )
            if [ "$PRERELEASE" = true ]; then
              args+=(--prerelease)
            fi
            gh release create "${args[@]}"
          }
          export -f ensure_release
          retry bash -c ensure_release
          retry gh release upload "$TAG" release/* --repo "$REPOSITORY" --clobber
